<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}CS Portal{% endblock %}</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#0b1220;
color:white;
display:flex;
min-height:100vh;
}

/* SIDEBAR */
.sidebar{
width:260px;
background:rgba(255,255,255,0.06);
backdrop-filter:blur(20px);
border-right:1px solid rgba(255,255,255,0.1);
padding:25px;
position:fixed;
height:100%;
}

.logo{
font-size:26px;
font-weight:700;
margin-bottom:30px;
background:linear-gradient(90deg,#3b82f6,#a855f7);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.sidebar a{
display:block;
padding:12px;
margin:8px 0;
text-decoration:none;
color:white;
border-radius:10px;
transition:.3s;
}

.sidebar a:hover{
background:linear-gradient(135deg,#3b82f6,#a855f7);
transform:translateX(5px);
}

/* MAIN */
.main{
margin-left:260px;
width:100%;
padding:25px;
}

/* TOP BAR */
.topbar{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
}

.user{
display:flex;
align-items:center;
gap:10px;
}

.avatar{
width:45px;
height:45px;
border-radius:50%;
background:linear-gradient(135deg,#3b82f6,#a855f7);
}

/* HERO */
.hero{
padding:25px;
border-radius:20px;
background:linear-gradient(135deg,#3b82f6,#a855f7);
margin-bottom:20px;
}

/* GRID */
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
}

/* CARD */
.card{
background:rgba(255,255,255,0.06);
border:1px solid rgba(255,255,255,0.1);
padding:20px;
border-radius:15px;
backdrop-filter:blur(15px);
transition:.3s;
}

.card:hover{
transform:translateY(-8px);
}

/* BUTTON */
.btn{
display:inline-block;
margin-top:12px;
padding:10px 15px;
background:linear-gradient(135deg,#3b82f6,#a855f7);
color:white;
text-decoration:none;
border-radius:10px;
}

footer{
text-align:center;
margin-top:30px;
opacity:0.6;
}

</style>
</head>

<body>

<div class="sidebar">
<div class="logo">CS PORTAL</div>

<a href="{{ url_for('dashboard')}}">Dashboard</a>
<a href="{{ url_for('edit_profile') }}">Profile</a>
<a href="{{ url_for('logout')}}">Logout</a>
</div>

<div class="main">

<div class="topbar">
<h2>{% block page_title %}{% endblock %}</h2>

<div class="user">
</div>
</div>

{% block content %}{% endblock %}

<footer>
© 2026 Computer Science Department
</footer>

</div>

</body>
</html>
