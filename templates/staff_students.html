{% extends "base.html" %}

{% block page_title %}
Students Records
{% endblock %}

{% block content %}

<div class="card">

<h2>Student List</h2>

<table width="100%">
<tr>
<th>ID</th>
<th>Name</th>
<th>Email</th>
<th>Year</th>
<th>Action</th>
</tr>

{% for s in students %}
<tr>
<td>{{s.id}}</td>
<td>{{s.fname}} {{s.lname}}</td>
<td>{{s.email}}</td>
<td>{{s.year}}</td>

<td>
<a class="btn"
href="/staff/delete-student/{{s.id}}">
Delete
</a>
</td>

</tr>
{% endfor %}
</table>

<hr><br>

<h2>Add New Student</h2>

<form method="POST">

<input type="text"
name="fname"
placeholder="First Name"
required><br><br>

<input type="text"
name="lname"
placeholder="Last Name"
required><br><br>

<input type="email"
name="email"
placeholder="Email"
required><br><br>

<input type="password"
name="password"
placeholder="Password"
required><br><br>

<input type="text"
name="phone"
placeholder="Phone"
required><br><br>

<input type="text"
name="year"
placeholder="Year"
required><br><br>

<input type="text"
name="cource"
placeholder="Course"
required><br><br>

<button class="btn" type="submit">
Add Student
</button>

</form>

</div>

{% endblock %}
